services:
  tg-service:
    image: tg-service:latest
    container_name: tg-auto-1
    restart: unless-stopped
    networks:
      - switch
    volumes:
      - ./config.json:/app/config.json
      - ./sessions:/app/sessions
    environment:
      - HTTP_PORT=8080
      - TZ=Asia/Shanghai
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 3

networks:
  switch:
    external: true
